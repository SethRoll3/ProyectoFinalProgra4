spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalogo-productos
              uri: lb://catalogo
              predicates:
                - Path=/api/productos,/api/productos/**
            - id: catalogo-categorias
              uri: lb://catalogo
              predicates:
                - Path=/api/categorias,/api/categorias/**
            - id: importaciones
              uri: lb://importaciones
              predicates:
                - Path=/api/importaciones,/api/importaciones/**
server:
  port: 8080
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
